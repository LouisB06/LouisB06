name: update language stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate top languages card
        env:
          STATS_READ_TOKEN: ${{ secrets.STATS_READ_TOKEN }}
        run: node scripts/generate-top-langs.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/top-langs.svg; then
            git add assets/top-langs.svg
            git commit -m "Update language stats"
            git push
          else
            echo "No changes to language stats."
          fi
