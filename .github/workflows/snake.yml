name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: LouisB06
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#34D399&color_dots=#18181b,#312e81,#4f46e5,#818CF8,#C4B5FD&color_dot_border=#09090B&sizeDotBorderRadius=6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#34D399&color_dots=#18181b,#312e81,#4f46e5,#818CF8,#C4B5FD&color_dot_border=#09090B&sizeDotBorderRadius=6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
