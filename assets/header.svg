<svg width="100%" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Louis Blake - Software Engineer, Data and Projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#101735"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1BFFFF"/>
      <stop offset="0.5" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#B26CFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1BFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1BFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B26CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B26CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- drifting glow orbs -->
  <circle cx="220" cy="90" r="260" fill="url(#glowA)">
    <animate attributeName="cx" values="220;300;220" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;130;90" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="230" r="280" fill="url(#glowB)">
    <animate attributeName="cx" values="980;900;980" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;180;230" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- floating code glyphs -->
  <g font-family="'Fira Code', 'SF Mono', Menlo, Consolas, monospace" fill="#1BFFFF" fill-opacity="0.22" font-size="22">
    <text x="90" y="250">&lt;/&gt;
      <animate attributeName="y" values="250;236;250" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="1060" y="80">{ }
      <animate attributeName="y" values="80;94;80" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="70" fill="#B26CFF">SELECT *
      <animate attributeName="y" values="70;58;70" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="1010" y="270" fill="#B26CFF">=&gt;
      <animate attributeName="y" values="270;258;270" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="940" y="150">01101
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="230" y="170" fill="#6C8CFF">npm run ship
      <animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- status pill -->
  <g transform="translate(600 62)">
    <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#1BFFFF" stroke-opacity="0.35"/>
    <circle cx="-108" cy="0" r="5" fill="#2BFF88">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="-92" y="5" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="13" fill="#cfe9ff">open to interesting problems</text>
  </g>

  <!-- name -->
  <text x="600" y="168" text-anchor="middle" font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#ffffff">Louis Blake
  </text>

  <!-- subtitle -->
  <text x="600" y="214" text-anchor="middle" font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e6efff" fill-opacity="0.85" letter-spacing="6">
    SOFTWARE ENGINEER  ·  DATA &amp; PROJECTS
    <animate attributeName="opacity" from="0" to="0.9" begin="0.5s" dur="1s" fill="freeze"/>
  </text>

  <!-- animated underline sweep -->
  <rect x="380" y="240" width="440" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="380" y="240" width="140" height="3" rx="1.5" fill="url(#neon)">
    <animate attributeName="x" values="380;680;380" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </rect>

  <text x="600" y="287" text-anchor="middle" font-family="'Fira Code',Menlo,Consolas,monospace" font-size="16" letter-spacing="3" fill="#1BFFFF" opacity="1">FOUNDER @ NOVALON  ·  LONDON<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.29;0.33;0.96;0.97;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="600" y="287" text-anchor="middle" font-family="'Fira Code',Menlo,Consolas,monospace" font-size="16" letter-spacing="3" fill="#1BFFFF" opacity="0">CS STUDENT @ ROYAL HOLLOWAY<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.34;0.62;0.66;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="600" y="287" text-anchor="middle" font-family="'Fira Code',Menlo,Consolas,monospace" font-size="16" letter-spacing="3" fill="#1BFFFF" opacity="0">FULL-STACK  ·  DATA  ·  SHIPPING<animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.63;0.67;0.95;0.99;1" dur="9s" repeatCount="indefinite"/></text>
  <!-- bottom edge line -->
  <rect y="316" width="1200" height="4" fill="url(#neon)"/>
</svg>
