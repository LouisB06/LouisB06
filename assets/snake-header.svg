<svg width="100%" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution snake: eating my commits">
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<clipPath id="c"><rect width="1200" height="150" rx="24"/></clipPath>
</defs>
<g clip-path="url(#c)"><rect width="1200" height="150" fill="#09090B"/><rect width="1200" height="150" fill="url(#dots)"/>
<circle cx="32" cy="30" r="7" fill="#FF5F57"/><circle cx="56" cy="30" r="7" fill="#FEBC2E"/><circle cx="80" cy="30" r="7" fill="#28C840"/>
<text x="600" y="35" text-anchor="middle" font-family="Fira Code,SF Mono,Menlo,Consolas,monospace" font-size="13" fill="#71717A">louis@github: ~/contributions</text>
<text x="40" y="88" font-family="Fira Code,SF Mono,Menlo,Consolas,monospace" font-size="22"><tspan fill="#34D399">➜</tspan> <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">./snake --eat commits --past-year</tspan></text>
<text x="40" y="122" font-family="Fira Code,SF Mono,Menlo,Consolas,monospace" font-size="14" fill="#A1A1AA">every glowing square is a day I shipped something<tspan fill="#38BDF8">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></tspan></text>
<g transform="translate(1040 80)">
<rect x="-8" y="-26" width="150" height="52" rx="26" fill="none" stroke="url(#neon)" stroke-opacity="0.6" stroke-width="1.5"/>
<g filter="url(#glow)"><path d="M0 0 H20 C34 0 34 -14 48 -14 S62 0 76 0 S90 14 104 14 S118 0 128 0" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 8"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.2s" repeatCount="indefinite"/></path><circle cx="130" cy="0" r="5" fill="#34D399"/></g>
</g></g><rect x="0.5" y="0.5" width="1199" height="149" rx="24" fill="none" stroke="#fff" stroke-opacity="0.1"/></svg>