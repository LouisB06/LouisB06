    <text x="40" y="272"><tspan fill="#34D399">➜</tspan> <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></tspan></text>
