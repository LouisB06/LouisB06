      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <style>.m{font-family:'Fira Code','SF Mono',Menlo,Consolas,monospace;font-size:20px}</style>
  <rect width="1200" height="300" rx="20" fill="#09090B"/>
