<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal card: whoami Louis Blake, Software Engineer, focus on data pipelines and deployment">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1BFFFF"/><stop offset="1" stop-color="#B26CFF"/>
    </linearGradient>
  </defs>
  <style>
    .m{font-family:'Fira Code','SF Mono',Menlo,Consolas,monospace;font-size:20px}
    .l{opacity:0;animation:show .01s forwards}
    .l1{animation-delay:.3s}.l2{animation-delay:1.3s}.l3{animation-delay:1.9s}
    .l4{animation-delay:2.5s}.l5{animation-delay:3.1s}.l6{animation-delay:3.9s}
    @keyframes show{to{opacity:1}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1200" height="300" rx="20" fill="#0b0f1a"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect width="1200" height="48" rx="20" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="32" cy="24" r="7" fill="#FF5F57"/><circle cx="56" cy="24" r="7" fill="#FEBC2E"/><circle cx="80" cy="24" r="7" fill="#28C840"/>
  <text x="600" y="30" text-anchor="middle" class="m" font-size="14" fill="#7f8db0" style="font-size:14px">louis@github: ~</text>

  <g class="m">
    <text x="40" y="95" class="l l1"><tspan fill="#2BFF88">➜</tspan> <tspan fill="#1BFFFF">~</tspan> <tspan fill="#e6efff">whoami</tspan></text>
    <text x="40" y="128" class="l l2" fill="#e6efff">Louis Blake · Software Engineer · Data &amp; Projects</text>
    <text x="40" y="170" class="l l3"><tspan fill="#2BFF88">➜</tspan> <tspan fill="#1BFFFF">~</tspan> <tspan fill="#e6efff">cat focus.txt</tspan></text>
    <text x="40" y="203" class="l l4" fill="#B26CFF">→ turning messy data into pipelines and products that ship</text>
    <text x="40" y="233" class="l l5" fill="#6C8CFF">→ deployment · tooling · cleaner data pipelines</text>
    <text x="40" y="272" class="l l6"><tspan fill="#2BFF88">➜</tspan> <tspan fill="#1BFFFF">~</tspan> <tspan class="cur" fill="#e6efff">█</tspan></text>
  </g>
</svg>
