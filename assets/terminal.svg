  <rect width="1200" height="48" rx="20" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="32" cy="24" r="7" fill="#FF5F57"/><circle cx="56" cy="24" r="7" fill="#FEBC2E"/><circle cx="80" cy="24" r="7" fill="#28C840"/>
